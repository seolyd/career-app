name: Find feeds

# 팟캐스트 RSS 주소와 유튜브 채널 ID를 한 번 찾기 위한 수동 실행 워크플로입니다.
# 매일 도는 "Refresh feed"와는 무관하고, 여기서 찾은 주소를 feed-sources.json에
# 손으로 넣은 뒤에야 수집에 들어갑니다 — 파이프라인은 정적 주소만 읽습니다.
#
# 쓰는 법: Actions 탭 → Find feeds → Run workflow → 로그의 주소를 복사.
#  - shows: 팟캐스트는 쇼 이름으로 찾습니다. 섞어서 한 번에 돌려도 됩니다.
#  - feeds: 이미 아는 RSS 후보 주소가 열리고 파싱되는지 확인합니다. 넣으면 shows는 건너뜁니다.
#
# 세션에서 외부로 못 나갈 때 여기 러너를 빌려 씁니다. 출력의 "최신" 제목을 꼭 보세요 —
# 200이 떠도 발행처가 엉뚱할 수 있습니다.
on:
  workflow_dispatch:
    inputs:
      shows:
        description: '쇼 이름 또는 @유튜브핸들 (쉼표로 구분)'
        required: false
        default: "Lenny's Podcast, Product Thinking with Melissa Perri, The Twenty Minute VC, Intercom on Product, The Product Podcast, @LennysPodcast, @ProductSchool, @ycombinator, @a16z, @TwoMinutePapers"
      feeds:
        description: 'RSS 후보 주소 (공백 또는 쉼표로 구분). 넣으면 쇼 검색은 건너뜁니다'
        required: false
        default: ''

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # feeds 확인은 실제 수집기를 돌리므로 fast-xml-parser가 필요합니다.
      - run: npm ci
        if: inputs.feeds != ''
      # 후보 RSS 주소가 실제로 열리고 파싱되는지 봅니다. 200이 떠도 발행처가
      # 엉뚱할 수 있으니 출력의 최신 제목을 꼭 확인하세요.
      - name: Check candidate feeds
        if: inputs.feeds != ''
        env:
          FEEDS: ${{ inputs.feeds }}
        run: node scripts/check-feeds.mjs "$FEEDS"

      - name: Look each show up
        if: inputs.feeds == '' && inputs.shows != ''
        env:
          SHOWS: ${{ inputs.shows }}
        run: |
          IFS=',' read -ra NAMES <<< "$SHOWS"
          for name in "${NAMES[@]}"; do
            trimmed="$(echo "$name" | sed 's/^ *//; s/ *$//')"
            [ -z "$trimmed" ] && continue
            echo "══════════════════════════════════════════"
            echo "검색: $trimmed"
            node scripts/find-podcast.mjs "$trimmed" || echo "  (찾지 못함)"
          done
