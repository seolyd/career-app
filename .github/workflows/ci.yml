name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR 브랜치에 연달아 푸시하면 이전 실행은 취소합니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild이 favicon.svg에서 아이콘을 만들고, tsc -b가 타입을 검사합니다.
      - run: npm run build
