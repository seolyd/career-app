name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild이 favicon.svg에서 아이콘을 만들고, tsc -b가 타입을 검사합니다.
      - run: npm run build
