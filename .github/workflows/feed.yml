name: Refresh feed

on:
  schedule:
    # 매일 20:00 UTC = 한국 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치면 늦은 쪽의 푸시가 거절됩니다. 줄을 세웁니다.
concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feed
      - name: Commit if changed
        run: |
          # git diff는 추적되지 않는 새 파일을 "변경 없음"으로 봅니다.
          # 첫 실행에서 feed.json이 커밋되지 않는 원인이었습니다.
          if [ -z "$(git status --porcelain public/feed.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 체크아웃 이후 main이 움직였을 수 있습니다 — PR 머지, 또는 겹친 실행.
          # feed.json은 생성물이라 병합할 게 없으므로, 최신 main 위에 결과를 다시 얹습니다.
          cp public/feed.json "$RUNNER_TEMP/feed.json"
          for attempt in 1 2 3; do
            git add public/feed.json
            git commit -q -m "Refresh feed" || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — replaying on the latest main (attempt $attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/feed.json" public/feed.json
            if [ -z "$(git status --porcelain public/feed.json)" ]; then
              echo "latest main already carries this feed"
              exit 0
            fi
          done
          echo "could not push after 3 attempts"
          exit 1
