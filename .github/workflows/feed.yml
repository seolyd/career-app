name: Refresh feed

on:
  schedule:
    # 매일 20:00 UTC = 한국 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feed
      - name: Commit if changed
        run: |
          # git diff는 추적되지 않는 새 파일을 "변경 없음"으로 봅니다.
          # 첫 실행에서 feed.json이 커밋되지 않는 원인이었습니다.
          if [ -z "$(git status --porcelain public/feed.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          git commit -m "Refresh feed"
          git push
