name: Refresh feed

on:
  schedule:
    # 매일 20:00 UTC = 한국 05:00
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run feed
      - name: Commit if changed
        run: |
          if git diff --quiet public/feed.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          git commit -m "Refresh feed"
          git push
